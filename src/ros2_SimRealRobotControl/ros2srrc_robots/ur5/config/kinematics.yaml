ur5_arm:
  kinematics_solver: kdl_kinematics_plugin/KDLKinematicsPlugin
  kinematics_solver_search_resolution: 0.005
  kinematics_solver_timeout: 0.05  # Increased timeout to allow more time for finding solutions
  kinematics_solver_attempts: 10   # Increased attempts to try more solutions (helps find elbow-up configurations)
  
# Note: KDL plugin doesn't have built-in elbow-up preference.
# The planner will prefer solutions close to the current state.
# To ensure elbow-up, start the robot in elbow-up configuration (home position has elbow_joint = 0).
# If elbow-down solutions are still found, consider using path constraints programmatically.