# Real UR5 + OnRobot 2FG7 gripper (davedovrat/onrobot_2fg7) — use with bringup config ur5_4
# Launch: ros2 launch ros2srrc_launch bringup_ur.launch.py package:=ros2srrc_ur5 config:=ur5_4 robot_ip:=<ROBOT_IP>
# Run:   ros2 run ros2srrc_execution ExecuteProgram.py package:=ros2srrc_execution program:=ur5_pick_and_place_onrobot
Specifications:
  Robot: "ur5"
  EndEffector: "onrobot_2fg7"
  EELink: "EE_robotiq_2f85"
  Objects: ["cube1"]

Sequence:

  - Step: 1
    Name: "Move to home position"
    Type: "MoveJ"
    Speed: 1.0
    Delay: 0.5
    Input:
      joint1: 90.0
      joint2: -89.9
      joint3: 90.0
      joint4: -90.0
      joint5: -90.0
      joint6: 0.0

  - Step: 2
    Name: "Open gripper"
    Type: "onrobot_2fg7"
    Action: "OPEN"
    Delay: 0.5

  - Step: 3
    Name: "Pick object at peg3 (right / Hanoi peg 2)"
    Type: "Pick"
    Delay: 0.5
    Input:
      x: 0.15    # peg3 / Hanoi peg2 — rightmost outer slot
      y: -0.12
      z: 0.84   # MoveIt cube center Z (reachable IK for UR5+2FG7)
      qx: -0.5
      qy: 0.5
      qz: 0.5
      qw: 0.5
    Config:
      approach_height: 0.25
      grasp_z_offset: 0.01
      grasp_extra_descend_m: 0.04
      approach_speed: 1.0
      descend_speed: 0.7
      lift_speed: 0.8
      cube_size: 0.05
      gripper_open: 0.110
      gripper_margin: 0.003

  - Step: 4
    Name: "Put down object at peg0 (left / Hanoi peg 0)"
    Type: "Place"
    Delay: 0.5
    Input:
      x: -0.15   # peg0 — leftmost outer slot
      y: -0.12
      z: 0.84
      qx: -0.5
      qy: 0.5
      qz: 0.5
      qw: 0.5
    Config:
      approach_height: 0.22
      place_z_offset: -0.01
      approach_speed: 1.0
      descend_speed: 0.7
      retract_speed: 0.8

  - Step: 5
    Name: "Return to home"
    Type: "MoveJ"
    Speed: 1.0
    Delay: 0.0
    Input:
      joint1: 90.0
      joint2: -89.9
      joint3: 90.0
      joint4: -90.0
      joint5: -90.0
      joint6: 0.0
