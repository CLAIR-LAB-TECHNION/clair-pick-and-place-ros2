
Specifications:
  Robot: "ur5"
  EndEffector: "ParallelGripper"
  EELink: "EE_robotiq_2f85"
  Objects: ["cube1"]

Sequence:

  - Step: 1
    Name: "Move to home position"
    Type: "MoveJ"
    Speed: 1.0
    Delay: 0.5
    Input:
      joint1: 90.0
      joint2: -89.0
      joint3: 90.0
      joint4: -90.0
      joint5: -90.0
      joint6: 0.0

  - Step: 2
    Name: "Open gripper"
    Type: "ParallelGripper"
    Action: "OPEN"
    Delay: 0.5

  - Step: 3
    Name: "Pick object at location"
    Type: "Pick"
    Delay: 0.5
    Input:
      x: 0.15
      y: 0.48
      z: 0.865
      qx: -0.5
      qy: 0.5
      qz: 0.5
      qw: 0.5
    Config:
      approach_height: 0.25
      grasp_z_offset: 0.03
      approach_speed: 1.0
      descend_speed: 0.7
      lift_speed: 0.8
      gripper_value: 30.0

  - Step: 4
    Name: "Move to place location"
    Type: "RobMove"
    Movement: "PTP"
    Speed: 1.0
    Delay: 0.5
    Input:
      x: -0.15
      y: 0.48
      z: 1.0
      qx: -0.5
      qy: 0.5
      qz: 0.5
      qw: 0.5

  - Step: 5
    Name: "Descend to place"
    Type: "RobMove"
    Movement: "LIN"
    Speed: 0.7
    Delay: 0.5
    Input:
      x: -0.15
      y: 0.48
      z: 0.865
      qx: -0.5
      qy: 0.5
      qz: 0.5
      qw: 0.5

  - Step: 6
    Name: "Open gripper - release object"
    Type: "ParallelGripper"
    Action: "OPEN"
    Delay: 1.0

  - Step: 7
    Name: "Retract from place location"
    Type: "RobMove"
    Movement: "LIN"
    Speed: 0.8
    Delay: 0.5
    Input:
      x: -0.15
      y: 0.48
      z: 1.0
      qx: -0.5
      qy: 0.5
      qz: 0.5
      qw: 0.5

  - Step: 8
    Name: "Return to home"
    Type: "MoveJ"
    Speed: 1.0
    Delay: 0.0
    Input:
      joint1: 90.0
      joint2: -89.0
      joint3: 90.0
      joint4: -90.0
      joint5: -90.0
      joint6: 0.0
