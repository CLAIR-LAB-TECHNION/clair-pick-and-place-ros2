# Same as ur5_setconstraints_baseline but with EndEffector: None (like ur5_demo).
# Use this if the baseline fails: confirms whether the issue is EE loading or the launch.
# Run: ros2 run ros2srrc_execution ExecuteProgram.py package:=ros2srrc_execution program:=ur5_setconstraints_baseline_no_ee

Specifications:
  Robot: "ur5"
  EndEffector: None
  EELink: None
  Objects: []

Sequence:
  - Step: 1
    Name: "Move to home"
    Type: "MoveJ"
    Speed: 1.0
    Delay: 0.3
    Input:
      joint1: 0.0
      joint2: -89.9
      joint3: 0.0
      joint4: -90.0
      joint5: 0.0
      joint6: 0.0

  - Step: 2
    Name: "Traverse to pose in front"
    Type: "RobMove"
    Movement: "PTP"
    Speed: 1.0
    Delay: 0.3
    Input:
      x: 0.15
      y: 0.48
      z: 0.50
      qx: -0.5
      qy: 0.5
      qz: 0.5
      qw: 0.5

  - Step: 3
    Name: "Return to home"
    Type: "MoveJ"
    Speed: 1.0
    Delay: 0.0
    Input:
      joint1: 0.0
      joint2: -89.9
      joint3: 0.0
      joint4: -90.0
      joint5: 0.0
      joint6: 0.0
